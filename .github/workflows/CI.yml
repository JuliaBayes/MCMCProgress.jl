name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.runner.version }} - ${{ matrix.runner.os }}
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner:
          - version: 'lts'
            os: ubuntu-latest
          - version: '1.11'
            os: ubuntu-latest
          - version: '1.12'
            os: ubuntu-latest
          - version: '1'
            os: ubuntu-latest
          - version: '1'
            os: macos-latest
          - version: '1'
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # 3.0.2
        with:
          version: ${{ matrix.runner.version }}
      - uses: julia-actions/cache@e32267b41e0fa7df82a3d53e8c7273620d52c586 # 3.4.0
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # 1.12.0
        env:
          JULIA_NUM_THREADS: 4,1
